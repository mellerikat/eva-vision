apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eva-vision.fullname" . }}
  labels:
    {{- include "eva-vision.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{ with .Values.strategy }}
  strategy:
    type: {{ .type | default "RollingUpdate" }}
    {{ if eq (.type | default "RollingUpdate") "Recreate" }}
    rollingUpdate: null
    {{ else }}
    {{ with .rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{ end }}
    {{ end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "eva-vision.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eva-vision.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "eva-vision.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default true }}
      {{- end }}

      imagePullSecrets:
        {{- if .Values.imagePullSecrets.enabled }}
          {{- if .Values.imagePullSecrets.ExistingSecret }}
        - name: {{ .Values.imagePullSecrets.ExistingSecret }}
          {{- else if .Values.imagePullSecrets.create }}
        - name: {{ include "eva-vision.fullname" . }}-regcred
          {{- end }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: eva-vision
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: proxy
              containerPort: 8000
              protocol: TCP
          {{- with .Values.probes.startup }}
          startupProbe:
            httpGet:
              path: /ready
              port: proxy
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /live
              port: proxy
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: proxy
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- $resources := deepCopy .Values.resources }}
            {{- if .Values.gpu.mig.resourceName }}
            {{- $_ := set $resources.limits .Values.gpu.mig.resourceName (.Values.gpu.count | int) }}
            {{- $_ := set $resources.requests .Values.gpu.mig.resourceName (.Values.gpu.count | int) }}
            {{- end }}
            {{- toYaml $resources | nindent 12 }}
          env:
            - name: TORCHSERVE_JVM_XMX
              value: {{ .Values.appConfig.jvmXmx | quote }}
            - name: MODEL_SOURCE
              value: {{ .Values.modelSource.type | quote }}
            - name: TORCHSERVE_LOAD_MODELS
              value: {{ .Values.appConfig.load_models | quote }}
            {{- if eq .Values.modelSource.type "s3" }}
            - name: MODEL_S3_URI
              value: {{ .Values.s3.modelUri | quote }}
            - name: AWS_REGION
              value: {{ .Values.s3.region | quote }}
            {{- if .Values.s3.existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
            {{- else if eq .Values.modelSource.type "harbor" }}
            - name: HARBOR_REGISTRY
              value: {{ required "harbor.registry is required when modelSource.type=harbor" .Values.harbor.registry | quote }}
            - name: HARBOR_PROJECT
              value: {{ required "harbor.project is required when modelSource.type=harbor" .Values.harbor.project | quote }}
            - name: HARBOR_INSECURE
              value: {{ .Values.harbor.insecure | quote }}
            - name: HARBOR_PLAIN_HTTP
              value: {{ .Values.harbor.plainHttp | quote }}
            {{- if .Values.harbor.existingSecret }}
            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.harbor.existingSecret }}
                  key: HARBOR_USERNAME
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.harbor.existingSecret }}
                  key: HARBOR_PASSWORD
            {{- end }}
            {{- end }}
            - name: DARTF_WORKERS
              value: {{ .Values.appConfig.dartfWorkers | quote }}
            - name: TORCHSERVE_JVM_MAX_DIRECT_MEMORY
              value: {{ .Values.appConfig.jvmMaxDirectMemory | quote }}
            {{- if ne (toString .Values.gpu.cudaVisibleDevices) "" }}
            - name: CUDA_VISIBLE_DEVICES
              value: {{ .Values.gpu.cudaVisibleDevices | quote }}
            {{- end }}
            - name: GPU_MPS_ENABLED
              value: {{ .Values.gpu.mps.enabled | quote }}
            - name: CUDA_MPS_PIPE_DIRECTORY
              value: {{ .Values.gpu.mps.pipeDirectory | quote }}
            - name: CUDA_MPS_LOG_DIRECTORY
              value: {{ .Values.gpu.mps.logDirectory | quote }}
            - name: EMBEDDING_ENABLED_MODELS
              value: {{ .Values.appConfig.embedding.enabledModels | quote }}
            - name: EMBEDDING_MODEL_ROOT
              value: {{ .Values.appConfig.embedding.modelRoot | quote }}
            - name: EMBEDDING_TORCH_COMPILE_MODELS
              value: {{ .Values.appConfig.embedding.torchCompileModels | quote }}
            - name: EMBEDDING_TORCH_COMPILE_BACKEND
              value: {{ .Values.appConfig.embedding.torchCompileBackend | quote }}
            - name: EMBEDDING_TORCH_COMPILE_MODE
              value: {{ .Values.appConfig.embedding.torchCompileMode | quote }}
            - name: EMBEDDING_TORCH_COMPILE_DYNAMIC
              value: {{ .Values.appConfig.embedding.torchCompileDynamic | quote }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/eva_ts/config.properties.template
              subPath: config.properties.template
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            {{- if .Values.gpu.mps.enabled }}
            - name: nvidia-mps
              mountPath: {{ .Values.gpu.mps.pipeDirectory | quote }}
            - name: nvidia-mps-log
              mountPath: {{ .Values.gpu.mps.logDirectory | quote }}
            {{- end }}
            {{- if .Values.modelCache.enabled }}
            - name: model-cache
              mountPath: {{ .Values.appConfig.embedding.modelRoot | quote }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: logs
              mountPath: {{ .Values.persistence.mountPath }}
              {{- if .Values.persistence.subPath }}
              subPath: {{ .Values.persistence.subPath }}
              {{- end }}
            {{- end }}

      volumes:
        - name: config-volume
          configMap:
            name: {{ include "eva-vision.fullname" . }}-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
        {{- if .Values.gpu.mps.enabled }}
        - name: nvidia-mps
          emptyDir: {}
        - name: nvidia-mps-log
          emptyDir: {}
        {{- end }}
        {{- if .Values.modelCache.enabled }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ .Values.modelCache.existingClaim | default (printf "%s-models" (include "eva-vision.fullname" .)) }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: logs
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}
                         {{ .Values.persistence.existingClaim }}
                       {{- else -}}
                         {{ include "eva-vision.fullname" . }}-logs
                       {{- end }}
        {{- end }}
